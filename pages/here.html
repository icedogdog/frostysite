<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>3d stuff</title>
    <link rel="stylesheet" href="here.css" />
</head>
<body>
    <div class="spacer2">
        <p>i'm here.</p>
        <p class="spacer2">...</p>
    </div>

    
    <div class="spacer">
        <p>why is everything the same?</p>
    </div>

    <div class="spacer3 indent1">
        <p>as it all shifts around me,</p>
        <p class="indent2">as its pace outruns me</p>
        <div class="spacer2">
            <p>i feel the same as i always was</p>
        </div>
        <p>was it always like this?</p>
    </div>

<p class=" indent3">...</p> 

    <div class="spacer2 indent3">
        <p>or will it?</p>
    </div>
    
    <div class="spacer3 indent4">
        <p class="spacer2 smaller">...</p>
        <p class="smaller">or wasn't it?</p>
    </div>

</body>
</html>
